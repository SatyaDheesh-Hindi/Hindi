name: Hindi Quality Test

# Read-only on both databases. Writes Hindi for a fixed panel of real articles
# (quality/panel.json) with the current prompt + style examples, and shows it next to
# what is currently shipped. Results: the run's Summary tab, the `report` artifact,
# and the quality-reports branch (report.html).
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Article IDs (comma-separated). Empty = the standard 15-article panel'
        required: false
        default: ''
      sample:
        description: 'Instead of ids: N fresh articles from the last 7 days, spread across categories (held-out test)'
        required: false
        default: ''
      shards:
        description: 'Parallel runners'
        required: false
        default: '3'
      model_repo:
        description: 'HF repo of the GGUF model'
        required: false
        default: 'unsloth/gemma-4-12b-it-GGUF'
      model_file:
        description: 'GGUF file'
        required: false
        default: 'gemma-4-12b-it-Q4_K_M.gguf'
      ref:
        description: 'Code branch to test (empty = main)'
        required: false
        default: ''

concurrency:
  group: hindi-quality-${{ github.event.inputs.model_file || 'default' }}
  cancel-in-progress: true

env:
  CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
  PYTHONPATH: ${{ github.workspace }}/.ci
  HINDI_MODEL_REPO: ${{ github.event.inputs.model_repo || 'unsloth/gemma-4-12b-it-GGUF' }}
  HINDI_MODEL_FILE: ${{ github.event.inputs.model_file || 'gemma-4-12b-it-Q4_K_M.gguf' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
      shards: ${{ steps.ids.outputs.shards }}
      n: ${{ steps.ids.outputs.n }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - id: ids
        shell: bash
        env:
          SATYA_DB_URL: ${{ secrets.SATYA_DB_URL }}
          SATYA_DB_TOKEN: ${{ secrets.SATYA_DB_TOKEN }}
          SAMPLE: ${{ github.event.inputs.sample }}
          IDS: ${{ github.event.inputs.ids }}
          N: ${{ github.event.inputs.shards || '3' }}
        run: |
          if [ -n "$SAMPLE" ]; then
            pip install -q libsql
            IDS=$(python quality/sample_ids.py "$SAMPLE" 7)
          fi
          echo "ids=$IDS" >> $GITHUB_OUTPUT
          echo "n=$N" >> $GITHUB_OUTPUT
          echo "shards=$(python3 -c "print(list(range($N)))")" >> $GITHUB_OUTPUT
          echo "ids: ${IDS:-standard panel}" >> $GITHUB_STEP_SUMMARY

  write:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.CORE_TOKEN }}
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.HINDI_MODEL_FILE }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # prebuilt CPU wheels; portable source build as fallback (no AVX-off build, no stale native wheels)
          CMAKE_ARGS="-DGGML_NATIVE=OFF" pip install -r requirements.txt \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --no-cache-dir
      - name: Write Hindi
        shell: bash
        env:
          SATYA_DB_URL: ${{ secrets.SATYA_DB_URL }}
          SATYA_DB_TOKEN: ${{ secrets.SATYA_DB_TOKEN }}
          SATYA_TRANSLATION_DB_URL: ${{ secrets.SATYA_TRANSLATION_DB_URL }}
          SATYA_TRANSLATION_DB_TOKEN: ${{ secrets.SATYA_TRANSLATION_DB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python quality/run_quality.py --shard ${{ matrix.shard }}/${{ needs.setup.outputs.n }} --ids "${{ needs.setup.outputs.ids }}" --out qout/${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: q-${{ matrix.shard }}
          path: qout/${{ matrix.shard }}.json

  report:
    needs: write
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: qout
          merge-multiple: true
      - name: Build report
        run: python quality/report.py qout/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            report.html
            report.md
      - name: Publish to quality-reports branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.run_id }}
        run: |
          set -e
          mkdir -p /tmp/pub && cp report.html report.md /tmp/pub/ && cp -r qout /tmp/pub/
          rm -rf /tmp/wt && mkdir /tmp/wt && cd /tmp/wt && git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${CORE_TOKEN}@github.com/${GITHUB_REPOSITORY}-core.git"
          if git fetch -q --depth 1 origin quality-reports; then git checkout -q -b quality-reports FETCH_HEAD; else git checkout -q --orphan quality-reports; fi
          mkdir -p "runs/$RUN" && cp -r /tmp/pub/* "runs/$RUN"/ && cp /tmp/pub/report.html index.html && cp /tmp/pub/report.md latest.md
          git add -A && git commit -qm "quality report $RUN" && git push -q origin HEAD:quality-reports
