name: Hindi Token Check

# Diagnoses dropped Devanagari words across llama.cpp builds and GGUF conversions.
# No database access. Results: run Summary + quality-reports branch (token-check/latest.md).
on:
  workflow_dispatch:

env:
  CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
  PYTHONPATH: ${{ github.workspace }}/.ci

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: "A unsloth Q4_K_M", build: prebuilt, mode: "llama", repo: unsloth/gemma-4-12b-it-GGUF, file: gemma-4-12b-it-Q4_K_M.gguf}
          - {label: "A unsloth Q4_K_M", build: prebuilt, mode: "hf", repo: unsloth/gemma-4-12b-it-GGUF, file: gemma-4-12b-it-Q4_K_M.gguf}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          token: ${{ secrets.CORE_TOKEN }}
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tokcheck-${{ matrix.file }}-${{ matrix.mode }}
      - name: Install (prebuilt)
        if: matrix.build == 'prebuilt'
        run: pip install huggingface-hub transformers jinja2 "llama-cpp-python>=0.3.35" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --no-cache-dir
      - name: Install (latest llama.cpp from source)
        if: matrix.build == 'source'
        run: |
          pip install huggingface-hub scikit-build-core cmake ninja
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/abetlen/llama-cpp-python /tmp/lcp
          cd /tmp/lcp/vendor/llama.cpp && git fetch --depth 1 origin master && git checkout FETCH_HEAD && cd /tmp/lcp
          CMAKE_ARGS="-DGGML_NATIVE=OFF" pip install . --no-cache-dir
      - name: Check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODE: ${{ matrix.mode }}
        run: python quality/token_check.py --repo "${{ matrix.repo }}" --file "${{ matrix.file }}" --label "${{ matrix.label }}" --out tok/${{ strategy.job-index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tok-${{ strategy.job-index }}
          path: tok/

  report:
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: tok
          merge-multiple: true
      - run: python quality/token_report.py tok/*.json
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.run_id }}
        run: |
          set -e
          mkdir -p /tmp/pub && cp token_report.md /tmp/pub/ && cp -r tok /tmp/pub/
          rm -rf /tmp/wt && mkdir /tmp/wt && cd /tmp/wt && git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${CORE_TOKEN}@github.com/${GITHUB_REPOSITORY}-core.git"
          if git fetch -q --depth 1 origin quality-reports; then git checkout -q -b quality-reports FETCH_HEAD; else git checkout -q --orphan quality-reports; fi
          mkdir -p "token-check/$RUN" && cp -r /tmp/pub/* "token-check/$RUN"/ && cp /tmp/pub/token_report.md token-check/latest.md
          git add -A && git commit -qm "token check $RUN" && git push -q origin HEAD:quality-reports
